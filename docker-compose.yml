services:
  # ── Redis (required for BullMQ job queue & AI processing) ──
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Next.js App ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── Required: Supabase ──
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:?err}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:?err}
      # ── Required: Redis connection (Docker internal hostname) ──
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # ── Auth (required for Supabase SSR) ──
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      # ── AI / Ollama ──
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-}
      # ── AI Processing (worker config — affects enqueued jobs) ──
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-}
      - WORKER_LIMITER_MAX=${WORKER_LIMITER_MAX:-}
      - WORKER_LIMITER_DURATION=${WORKER_LIMITER_DURATION:-}
      - WORKER_STALLED_INTERVAL=${WORKER_STALLED_INTERVAL:-}
      - WORKER_LOCK_DURATION=${WORKER_LOCK_DURATION:-}
      - AI_CONNECTION_LIMIT=${AI_CONNECTION_LIMIT:-}
      - AI_BATCH_SIZE=${AI_BATCH_SIZE:-}
      # ── Job retention (Redis memory) ──
      - JOB_RETAIN_COMPLETE_HOURS=${JOB_RETAIN_COMPLETE_HOURS:-}
      - JOB_RETAIN_FAIL_HOURS=${JOB_RETAIN_FAIL_HOURS:-}
      # ── Rate limiting (middleware — Upstash for Vercel, in-memory for Docker) ──
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-}
      # ── Backfill ──
      - BACKFILL_CRON=${BACKFILL_CRON:-}
      - BACKFILL_BATCH=${BACKFILL_BATCH:-}
      - BACKFILL_ENABLED=${BACKFILL_ENABLED:-}
      # ── Notifications ──
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── AI Worker (optional — run separately for production) ──
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: nexus-worker
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:?err}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:?err}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      # ── AI / Ollama ──
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-}
      # ── Worker performance ──
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-}
      - WORKER_LIMITER_MAX=${WORKER_LIMITER_MAX:-}
      - WORKER_LIMITER_DURATION=${WORKER_LIMITER_DURATION:-}
      - WORKER_STALLED_INTERVAL=${WORKER_STALLED_INTERVAL:-}
      - WORKER_LOCK_DURATION=${WORKER_LOCK_DURATION:-}
      - AI_CONNECTION_LIMIT=${AI_CONNECTION_LIMIT:-}
      # ── Job retention (Redis memory) ──
      - JOB_RETAIN_COMPLETE_HOURS=${JOB_RETAIN_COMPLETE_HOURS:-}
      - JOB_RETAIN_FAIL_HOURS=${JOB_RETAIN_FAIL_HOURS:-}
      # ── Backfill ──
      - BACKFILL_CRON=${BACKFILL_CRON:-*/15 * * * *}
      - BACKFILL_BATCH=${BACKFILL_BATCH:-}
      - BACKFILL_ENABLED=${BACKFILL_ENABLED:-}
      # ── Health check ──
      - WORKER_HEALTH_PORT=${WORKER_HEALTH_PORT:-}
      # ── Database listener ──
      - DATABASE_URL=${DATABASE_URL}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis-data:
